[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-leaf-recognition"
version = "1.0.0"
description = "Hybrid ResNet-101 + ViT-B/16 feature fusion for 100-species plant leaf recognition, evaluated over repeated stratified splits."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yixuan Zhang"}]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
leafnet = "leafnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
